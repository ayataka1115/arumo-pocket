  <!-- 顔（頬） -->
  <circle cx="30" cy="52" r="3" fill="#FBD8D0"/>
  <circle cx="50" cy="52" r="3" fill="#FBD8D0"/>
  <!-- 目 -->
  <circle cx="32" cy="49" r="1.6" fill="#2E2A24"/>
  <circle cx="48" cy="49" r="1.6" fill="#2E2A24"/>
  <!-- 口（にっこり） -->
  <path d="M35 58 Q40 62 45 58" stroke="#2E2A24" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- 小さな星（"ある" のきらめき） -->
